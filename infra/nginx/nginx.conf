# =============================================================================
# ClinicApp - Gateway inverso (Nginx)
#
#   http://localhost:8080/                     -> Laravel (api)
#   http://localhost:8080/notifications-service/... -> FastAPI
#
# Tambien es la primera barrera de seguridad: normaliza cabeceras, limita el
# tamano del cuerpo, aplica limitacion de tasa y no expone cabeceras internas.
# =============================================================================

user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/json;

    log_format  json_combined escape=json
        '{'
        '"time":"$time_iso8601",'
        '"remote_addr":"$remote_addr",'
        '"request_id":"$request_id",'
        '"method":"$request_method",'
        '"uri":"$uri",'
        '"status":$status,'
        '"body_bytes_sent":$body_bytes_sent,'
        '"request_time":$request_time,'
        '"upstream_time":"$upstream_response_time",'
        '"user_agent":"$http_user_agent"'
        '}';

    access_log /var/log/nginx/access.log json_combined;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    server_tokens   off;
    keepalive_timeout   65;
    client_max_body_size 1m;
    client_body_timeout  15s;
    client_header_timeout 15s;

    # Limitacion de tasa (zona en memoria, 10 MB de estado)
    limit_req_zone $binary_remote_addr zone=perip:10m rate=30r/s;
    limit_req_status 429;
    limit_conn_zone $binary_remote_addr zone=conns:10m;

    gzip              on;
    gzip_comp_level   5;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types        application/json text/plain text/css application/javascript;

    upstream clinic_api {
        server api:8000 max_fails=3 fail_timeout=10s;
        keepalive 16;
    }

    upstream clinic_notifications {
        server notification-service:8000 max_fails=3 fail_timeout=10s;
        keepalive 16;
    }

    server {
        listen      80 default_server;
        server_name _;

        limit_conn conns 64;

        # Cabeceras de seguridad (defensa en profundidad).
        #
        # NOTA SOBRE LA DUPLICIDAD: `add_header` NO comprueba si la cabecera ya
        # existe, simplemente la anade. Laravel y FastAPI tambien emiten
        # X-Content-Type-Options, X-Frame-Options y Referrer-Policy, de modo que
        # sin `proxy_hide_header` el cliente recibiria cada cabecera dos veces
        # (con el mismo valor, asi que no es un agujero, pero si ruido que hace
        # la traza de respuestas confusa). Por eso el gateway se declara fuente
        # UNICA de estas tres y oculta las del upstream. Strict-Transport-Security
        # solo la emite el gateway, porque es quien sabe si hay TLS delante.
        add_header X-Content-Type-Options   "nosniff" always;
        add_header X-Frame-Options        "DENY" always;
        add_header Referrer-Policy        "no-referrer" always;
        add_header Strict-Transport-Security "max-age=31536000" always;

        # --- Microservicio FastAPI -------------------------------------------
        # El prefijo /notifications-service se elimina antes de reenviar
        # (proxy_pass con URI => upstream usa solo la parte posterior a la "/").
        location /notifications-service/ {
            limit_req zone=perip burst=60 nodelay;

            proxy_pass http://clinic_notifications/;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # El identificador de Nginx viaja como cabecera y la aplicacion lo
            # reutiliza: asi el `request_id` del log del gateway, el del log de
            # FastAPI y el de la respuesta son el MISMO valor.
            proxy_set_header X-Request-Id      $request_id;
            proxy_set_header Connection        "";

            proxy_hide_header X-Content-Type-Options;
            proxy_hide_header X-Frame-Options;
            proxy_hide_header Referrer-Policy;

            proxy_connect_timeout 5s;
            proxy_read_timeout    30s;
            proxy_send_timeout    30s;
        }

        # --- API principal (Laravel) -----------------------------------------
        location / {
            limit_req zone=perip burst=120 nodelay;

            proxy_pass http://clinic_api;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-Id      $request_id;
            proxy_set_header Connection        "";

            proxy_hide_header X-Content-Type-Options;
            proxy_hide_header X-Frame-Options;
            proxy_hide_header Referrer-Policy;

            proxy_connect_timeout 5s;
            proxy_read_timeout    60s;
            proxy_send_timeout    60s;
        }

        # Documentacion interactiva de FastAPI
        location = /notifications-service {
            return 301 /notifications-service/docs;
        }
    }
}
