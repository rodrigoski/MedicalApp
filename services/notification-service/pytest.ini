[pytest]
testpaths = tests
pythonpath = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -q --strict-markers

# Se silencia el log del servicio durante las pruebas: sin esto, los `extra` de
# los avisos de seguridad ensucian la salida de pytest y dificultan leer un fallo
# real entre el ruido.
log_cli = false

[coverage:run]
source = app
omit =
    */__init__.py
    app/main.py

[coverage:report]
show_missing = true
skip_covered = false
